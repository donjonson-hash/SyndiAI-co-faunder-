version: "3.9"

# Production stack
# Deploy: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: syndiai_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syndiai}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/backups:/backups
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.7
      -c wal_buffers=16MB
      -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syndiai_user} -d ${POSTGRES_DB:-syndiai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - syndiai_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syndiai_app_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_ID: ${APP_ID}
      APP_SECRET: ${APP_SECRET}
      VITE_APP_ID: ${VITE_APP_ID}
      VITE_KIMI_AUTH_URL: ${VITE_KIMI_AUTH_URL}
      KIMI_AUTH_URL: ${KIMI_AUTH_URL}
      KIMI_OPEN_URL: ${KIMI_OPEN_URL}
      OWNER_UNION_ID: ${OWNER_UNION_ID}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - syndiai_network

volumes:
  postgres_data:
    driver: local

networks:
  syndiai_network:
    driver: bridge
