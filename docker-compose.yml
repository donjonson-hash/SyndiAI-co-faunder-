version: "3.9"

services:
  # ─── PostgreSQL Database ──────────────────
  postgres:
    image: postgres:16-alpine
    container_name: syndiai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: syndiai
      POSTGRES_USER: syndiai_user
      POSTGRES_PASSWORD: syndiai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndiai_user -d syndiai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - syndiai_network

  # ─── PGAdmin (Dev Tool) ───────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: syndiai_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@syndiai.dev
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - syndiai_network

  # ─── SyndiAI App ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syndiai_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://syndiai_user:syndiai_password@postgres:5432/syndiai
      APP_ID: ${APP_ID}
      APP_SECRET: ${APP_SECRET}
      VITE_APP_ID: ${VITE_APP_ID}
      VITE_KIMI_AUTH_URL: ${VITE_KIMI_AUTH_URL}
      KIMI_AUTH_URL: ${KIMI_AUTH_URL}
      KIMI_OPEN_URL: ${KIMI_OPEN_URL}
      OWNER_UNION_ID: ${OWNER_UNION_ID}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - syndiai_network

# ─── Volumes ────────────────────────────────
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# ─── Networks ───────────────────────────────
networks:
  syndiai_network:
    driver: bridge
